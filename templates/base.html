<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema Clínico{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilo extra opcional -->
    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .card-shadow {
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

    <div class="container">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            🏥 Sistema Clínico
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'lista_pacientes' %}">Pacientes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning" href="#">
                        Bienvenida Dr(a).
                    </a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-danger btn-sm ms-2" href="{% url 'logout' %}">
                        Salir
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- CONTENIDO -->
<div class="container mt-4">

    <div class="card card-shadow p-4">

        {% block content %}
        {% endblock %}

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
