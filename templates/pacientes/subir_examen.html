{% extends 'base.html' %}

{% block title %}Subir Examen{% endblock %}

{% block content %}

<div class="card shadow-sm p-4">

    <h3 class="mb-3 text-primary">📎 Subir Examen</h3>

    <p class="mb-4">
        Paciente: <strong>{{ paciente.nombre }}</strong>
    </p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Archivo (PDF o imagen)</label>
            {{ form.archivo }}
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción (opcional)</label>
            {{ form.descripcion }}
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                ✅ Subir Examen
            </button>

            <a href="{% url 'detalle_paciente' paciente.id %}" class="btn btn-secondary">
                ⬅ Volver al expediente
            </a>
        </div>

    </form>

</div>

{% endblock %}
